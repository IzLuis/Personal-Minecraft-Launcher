name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (no native downloads needed for tests)
        run: npm ci --ignore-scripts
      - run: npm test

  release:
    # Build installers only for version tags: git tag v0.1.0 && git push --tags
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Bake group CurseForge API key (from repo secret, kept out of source)
        shell: bash
        env:
          CFK: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if [ -n "$CFK" ]; then
            node -e "require('fs').writeFileSync('src/main/baked.json', JSON.stringify({ curseforgeApiKey: process.env.CFK }))"
            echo "CurseForge key baked into the build."
          else
            echo "No CURSEFORGE_API_KEY secret set — building without a baked key."
          fi
      - name: Build installers
        run: npx electron-builder --publish never

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.yml
            dist/*.blockmap
