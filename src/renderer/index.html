<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src https: data: 'self'; media-src https:; connect-src 'none'; font-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IzLauncher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <img class="brand-icon" src="icon.png" alt="" />
        <div>
          <div class="brand-name">IzLauncher</div>
          <div class="brand-sub" id="brand-version"></div>
        </div>
      </div>

      <button id="account-chip" class="account-chip" title="Accounts">
        <span class="avatar" id="account-avatar"></span>
        <span id="account-name"></span>
      </button>

      <nav id="nav"></nav>

      <div class="sidebar-section" id="instances-label"></div>
      <div id="instance-list" class="instance-list"></div>

      <div class="sidebar-actions">
        <button id="btn-new" class="btn"></button>
        <button id="btn-import" class="btn primary"></button>
      </div>

      <button id="btn-discord" class="btn discord hidden"></button>

      <div id="launcher-update" class="launcher-update hidden">
        <div id="lu-text"></div>
        <button id="lu-restart" class="btn primary small hidden"></button>
      </div>

      <div id="global-progress" class="global-progress hidden">
        <div class="gp-label" id="gp-label"></div>
        <div class="gp-bar"><div class="gp-fill" id="gp-fill"></div></div>
      </div>
    </aside>

    <main id="main"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="i18n.js"></script>
  <script src="md.js"></script>
  <script src="app.js"></script>
</body>
</html>
