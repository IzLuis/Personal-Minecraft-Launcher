<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src https: data:; connect-src 'none'; font-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Minecraft Launcher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-block">⛏</div>
        <div>
          <div class="brand-name">PMC Launcher</div>
          <div class="brand-sub" id="brand-version"></div>
        </div>
      </div>

      <button id="account-chip" class="account-chip" title="Manage accounts">
        <span class="avatar" id="account-avatar"></span>
        <span id="account-name">No account</span>
      </button>

      <nav>
        <button class="nav-btn" data-nav="library">📦 Library</button>
        <button class="nav-btn" data-nav="settings">⚙ Settings</button>
      </nav>

      <div class="sidebar-section">Instances</div>
      <div id="instance-list" class="instance-list"></div>

      <div class="sidebar-actions">
        <button id="btn-new" class="btn">＋ New</button>
        <button id="btn-import" class="btn primary">⬇ Import pack</button>
      </div>

      <div id="global-progress" class="global-progress hidden">
        <div class="gp-label" id="gp-label"></div>
        <div class="gp-bar"><div class="gp-fill" id="gp-fill"></div></div>
      </div>
    </aside>

    <main id="main"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="app.js"></script>
</body>
</html>
